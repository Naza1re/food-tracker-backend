spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ft
    username: ft
    password: ft
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

usda:
  api-key: ${USDA_API_KEY}
  base-url: ${USDA_BASE_URL}
