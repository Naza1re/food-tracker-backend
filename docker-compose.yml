version: '3.8'

services:
  postgres:
    image: postgres:15.3
    container_name: postgres-container
    environment:
      POSTGRES_USER: ft
      POSTGRES_PASSWORD: ft
      POSTGRES_DB: ft
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
